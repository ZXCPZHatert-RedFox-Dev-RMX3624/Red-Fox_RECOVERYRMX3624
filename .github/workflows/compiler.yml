name: Build Red-Fox Recovery (OrangeFox 12.1) for RMX3624

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Device Tree
        uses: actions/checkout@v4

      - name: Free Disk Space & Add Swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo fallocate -l 10G /swapfile_fox
          sudo chmod 600 /swapfile_fox
          sudo mkswap /swapfile_fox
          sudo swapon /swapfile_fox
          df -h

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 libncurses5 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 python-is-python3 cpio aria2

      - name: Sync OrangeFox 12.1 Sources
        run: |
          sudo curl -L "https://storage.googleapis.com/git-repo-downloads/repo" -o /usr/local/bin/repo
          sudo chmod a+x /usr/local/bin/repo
          sudo curl -L "https://storage.googleapis.com/git-repo-downloads/repo" -o /usr/local/bin/repo
          sudo chmod a+x /usr/local/bin/repo
          sudo curl -L "https://storage.googleapis.com/git-repo-downloads/repo" -o /usr/local/bin/repo
          sudo chmod a+x /usr/local/bin/repo
          git config --global user.name "RedFox-Dev"
          git config --global user.email "pavelshiskalov0@gmail.com"
          git config --global color.ui false
          mkdir -p ~/work/OrangeFox
          cd ~/work/OrangeFox
          git clone https://gitlab.com/OrangeFox/sync.git ~/fox_sync
          cd ~/fox_sync
          ./orangefox_sync.sh --branch 12.1 --path ~/work/OrangeFox

      - name: Install ARM64 Browser (Links + HTTPS) & Static Curl
        run: |
          sudo apt-get install -y qemu-user-static
          mkdir -p /tmp/alpine_arm64 && cd /tmp/alpine_arm64
          curl -L "https://dl-cdn.alpinelinux.org/alpine/v3.20/releases/aarch64/alpine-minirootfs-3.20.3-aarch64.tar.gz" -o alpine.tar.gz
          sudo tar -xzf alpine.tar.gz
          sudo cp /usr/bin/qemu-aarch64-static usr/bin/
          sudo cp /etc/resolv.conf etc/resolv.conf
          sudo chroot /tmp/alpine_arm64 /bin/sh -c "
            apk update &&
            apk add --no-cache links curl xz ca-certificates
          "
          mkdir -p $GITHUB_WORKSPACE/recovery/root/system/bin $GITHUB_WORKSPACE/recovery/root/lib $GITHUB_WORKSPACE/recovery/root/usr/lib $GITHUB_WORKSPACE/recovery/root/etc/ssl
          sudo cp /tmp/alpine_arm64/usr/bin/links $GITHUB_WORKSPACE/recovery/root/system/bin/links
          sudo cp /tmp/alpine_arm64/usr/bin/curl $GITHUB_WORKSPACE/recovery/root/system/bin/curl
          sudo cp -a /tmp/alpine_arm64/lib/ld-musl-aarch64.so.1 /tmp/alpine_arm64/lib/libz.so* /tmp/alpine_arm64/lib/libcrypto.so* /tmp/alpine_arm64/lib/libssl.so* $GITHUB_WORKSPACE/recovery/root/lib/ || true
          sudo cp -a /tmp/alpine_arm64/usr/lib/libevent*.so* /tmp/alpine_arm64/usr/lib/libbrotli*.so* /tmp/alpine_arm64/usr/lib/libzstd*.so* /tmp/alpine_arm64/usr/lib/libbz2*.so* /tmp/alpine_arm64/usr/lib/liblzma*.so* /tmp/alpine_arm64/usr/lib/libgpm*.so* $GITHUB_WORKSPACE/recovery/root/usr/lib/ || true
          sudo cp -r /tmp/alpine_arm64/etc/ssl/* $GITHUB_WORKSPACE/recovery/root/etc/ssl/ || true
          sudo chown -R $USER:$USER $GITHUB_WORKSPACE/recovery/root
          chmod 755 $GITHUB_WORKSPACE/recovery/root/system/bin/links $GITHUB_WORKSPACE/recovery/root/system/bin/curl

      - name: Build Red-Fox Recovery
        shell: bash
        run: |
          FOX_DIR=~/work/OrangeFox
          [ -d "$FOX_DIR/fox_12.1/build" ] && FOX_DIR="$FOX_DIR/fox_12.1"
          mkdir -p "$FOX_DIR/device/realme/RMX3624"
          rsync -a --exclude=".git" "$GITHUB_WORKSPACE/" "$FOX_DIR/device/realme/RMX3624/"
          cd "$FOX_DIR"
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE=RMX3624
          export TW_THEME=portrait_hdpi
          export TARGET_SCREEN_WIDTH=720
          export TARGET_SCREEN_HEIGHT=1600
          export TW_MAX_BRIGHTNESS=255
          export TW_DEFAULT_BRIGHTNESS=120
          export LC_ALL="C"
          set +e
          sed -i "s/\$(error Build failed)/\$(warning Artifact check bypassed)/g" build/make/core/artifact_path_requirements.mk || true
          : > build/make/core/artifact_path_requirements.mk
          source build/envsetup.sh
          lunch twrp_RMX3624-eng || lunch twrp_RMX3624-userdebug || lunch fox_RMX3624-eng
          set -e
          mka recoveryimage -j$(nproc --all)
          mkdir -p /tmp/out_img
          sudo find out / -maxdepth 4 -type f \( -name "recovery.img" -o -name "vendor_boot.img" -o -name "OrangeFox*.img" -o -name "OrangeFox*.zip" \) -exec cp {} /tmp/out_img/ \; 2>/dev/null || true; sudo chown -R $USER:$USER /tmp/out_img; ls -lh /tmp/out_img/

      - name: Upload Red-Fox Recovery Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RedFox-Recovery-RMX3624-v1.0
          path: /tmp/out_img/*
