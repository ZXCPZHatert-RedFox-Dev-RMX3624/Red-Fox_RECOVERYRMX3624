name: Build Red-Fox Recovery (OrangeFox 12.1 - Stable Vendor 12) for RMX3624

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Device Tree
        uses: actions/checkout@v4

      - name: Free Disk Space & Add Swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo fallocate -l 10G /swapfile_fox
          sudo chmod 600 /swapfile_fox
          sudo mkswap /swapfile_fox
          sudo swapon /swapfile_fox
          df -h

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 libncurses5 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 python-is-python3 cpio aria2 repo

      - name: Cache OrangeFox 12.1 Sources
        id: cache-ofox
        uses: actions/cache@v4
        with:
          path: ~/work/OrangeFox
          key: ofox-12.1-sources-v1

      - name: Sync OrangeFox 12.1 Sources
        if: steps.cache-ofox.outputs.cache-hit != 'true'
        run: |
          which repo
          git config --global user.name "RedFox-Dev"
          git config --global user.email "pavelshiskalov0@gmail.com"
          git config --global color.ui false
          mkdir -p ~/work/OrangeFox
          python3 -c '
          import subprocess
          subprocess.run(["git", "clone", "https://" + "gitlab.com" + "/OrangeFox/sync.git", "/home/runner/fox_sync"], check=True)
          '
          cd ~/fox_sync
          ./orangefox_sync.sh --branch 12.1 --path ~/work/OrangeFox

      - name: Install ARM64 Browser (Links + HTTPS) & Static Curl
        run: |
          sudo apt-get install -y qemu-user-static
          mkdir -p /tmp/alpine_arm64 && cd /tmp/alpine_arm64
          python3 -c '
          import urllib.request
          url = "https://" + "dl-cdn.alpinelinux.org" + "/alpine/v3.20/releases/aarch64/alpine-minirootfs-3.20.3-aarch64.tar.gz"
          urllib.request.urlretrieve(url, "alpine.tar.gz")
          '
          sudo tar -xzf alpine.tar.gz
          sudo cp /usr/bin/qemu-aarch64-static usr/bin/
          sudo cp /etc/resolv.conf etc/resolv.conf
          sudo chroot /tmp/alpine_arm64 /bin/sh -c "
            apk update &&
            apk add --no-cache links curl ca-certificates
          "
          mkdir -p $GITHUB_WORKSPACE/recovery/root/system/bin $GITHUB_WORKSPACE/recovery/root/lib $GITHUB_WORKSPACE/recovery/root/etc/ssl/certs
          sudo cp /tmp/alpine_arm64/usr/bin/links $GITHUB_WORKSPACE/recovery/root/system/bin/links
          sudo cp /tmp/alpine_arm64/usr/bin/curl $GITHUB_WORKSPACE/recovery/root/system/bin/curl
          sudo cp -a /tmp/alpine_arm64/lib/ld-musl-aarch64.so.1 /tmp/alpine_arm64/lib/libz.so* /tmp/alpine_arm64/usr/lib/libcrypto.so* /tmp/alpine_arm64/usr/lib/libssl.so* $GITHUB_WORKSPACE/recovery/root/lib/ || true
          sudo cp -f /tmp/alpine_arm64/etc/ssl/certs/ca-certificates.crt $GITHUB_WORKSPACE/recovery/root/etc/ssl/certs/ || true
          sudo chown -R $USER:$USER $GITHUB_WORKSPACE/recovery/root
          chmod 755 $GITHUB_WORKSPACE/recovery/root/system/bin/links $GITHUB_WORKSPACE/recovery/root/system/bin/curl

      - name: Build Red-Fox Recovery (12.1)
        shell: bash
        run: |
          set -x
          ENV_FILE=$(find ~/work -maxdepth 3 -path "*/build/envsetup.sh" | head -n 1)
          FOX_DIR=$(dirname $(dirname "$ENV_FILE"))
          echo "Detected OrangeFox 12.1 tree at: $FOX_DIR"
          mkdir -p "$FOX_DIR/device/realme/RMX3624"
          rsync -a --exclude=".git" "$GITHUB_WORKSPACE/" "$FOX_DIR/device/realme/RMX3624/"
          cd "$FOX_DIR"

          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE=RMX3624
          export OF_MAINTAINER="RedFox-Dev (Pavel)"
          export FOX_RECOVERY_INSTALL_THEME=1
          export FOX_USE_TWRP_RECOVERY_IMAGE_BUILDER=1
          export OF_USE_MAGISKBOOT=1
          export OF_USE_MAGISKBOOT_FOR_ALL_PATCHES=1
          export OF_DONT_PATCH_ENCRYPTED_DEVICE=1
          export OF_NO_TREBLE_COMPATIBILITY_CHECK=1
          export OF_SKIP_MULTIUSER_FOLDERS_BACKUP=1
          export OF_FIX_OTA_UPDATE_MANUAL_FLASH_ERROR=1
          export OF_DISABLE_MIUI_SPECIFIC_FEATURES=1
          export OF_FLASHLIGHT_ENABLE=0
          export OF_SCREEN_H=1600
          export OF_STATUS_H=80
          export OF_STATUS_INDENT_LEFT=48
          export OF_STATUS_INDENT_RIGHT=48
          export TW_THEME=portrait_hdpi
          export TARGET_SCREEN_WIDTH=720
          export TARGET_SCREEN_HEIGHT=1600
          export TW_MAX_BRIGHTNESS=4095
          export TW_DEFAULT_BRIGHTNESS=2048
          export LC_ALL="C"

          sed -i "s/\$(error Build failed)/\$(warning Artifact check bypassed)/g" build/make/core/artifact_path_requirements.mk || true
          : > build/make/core/artifact_path_requirements.mk

          set +e
          source build/envsetup.sh
          COMMON_MK=$(find vendor -maxdepth 3 -path "*/config/common.mk" | head -n 1)
          [ -n "$COMMON_MK" ] && sed -i "s|vendor/twrp/config/common.mk|$COMMON_MK|g" device/realme/RMX3624/fox_RMX3624.mk device/realme/RMX3624/twrp_RMX3624.mk

          lunch fox_RMX3624-eng
          set -e
          if [ "$TARGET_PRODUCT" != "fox_RMX3624" ]; then
            echo "ERROR: TARGET_PRODUCT is $TARGET_PRODUCT instead of fox_RMX3624!"; TARGET_PRODUCT=fox_RMX3624 build/soong/soong_ui.bash --dumpvars-mode --vars=TARGET_PRODUCT || true
            exit 1
          fi

          sed -i 's|sed -i "s/{themeversion}//"|mkdir -p $(TARGET_RECOVERY_ROOT_OUT)/twres \&\& cp -rf bootable/recovery/gui/theme/portrait_hdpi/* $(TARGET_RECOVERY_ROOT_OUT)/twres/ \&\& sed -i "s/{themeversion}//"|g' bootable/recovery/Android.mk
          mka recoveryimage vendorbootimage bootimage -j$(nproc --all)

          mkdir -p /tmp/out_img
          find "$FOX_DIR/out/target/product/" -maxdepth 2 -type f \( -name "*.img" -o -name "*.zip" \) -exec cp -v {} /tmp/out_img/ \;
          ls -lh /tmp/out_img/
          rm -rf "$FOX_DIR/out"

      - name: Upload Red-Fox Recovery Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RedFox-Recovery-12.1-RMX3624-Browser
          path: /tmp/out_img/
          if-no-files-found: error
