name: Build Red-Fox Recovery (OrangeFox 12.1) for RMX3624

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Device Tree
        uses: actions/checkout@v4

      - name: Free Disk Space & Add Swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo fallocate -l 10G /swapfile_fox
          sudo chmod 600 /swapfile_fox
          sudo mkswap /swapfile_fox
          sudo swapon /swapfile_fox
          df -h

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 libncurses5 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 python-is-python3 cpio aria2

      - name: Sync OrangeFox 12.1 Sources
        run: |
          sudo curl -L "https://storage.googleapis.com/git-repo-downloads/repo" -o /usr/local/bin/repo
          sudo chmod a+x /usr/local/bin/repo
          sudo curl -L "https://storage.googleapis.com/git-repo-downloads/repo" -o /usr/local/bin/repo
          sudo chmod a+x /usr/local/bin/repo
          git config --global user.name "RedFox-Dev"
          git config --global user.email "pavelshiskalov0@gmail.com"
          git config --global color.ui false
          mkdir -p ~/work/OrangeFox
          cd ~/work/OrangeFox
          git clone https://gitlab.com/OrangeFox/sync.git ~/fox_sync
          cd ~/fox_sync
          ./orangefox_sync.sh --branch 12.1 --path ~/work/OrangeFox

      - name: Build Static ARM64 Graphical Browser (Links + Framebuffer)
        run: |
          mkdir -p /tmp/browser_build && cd /tmp/browser_build
          curl -L "https://musl.cc/aarch64-linux-musl-cross.tgz" -o musl.tgz
          tar -xzf musl.tgz
          export PATH="/tmp/browser_build/aarch64-linux-musl-cross/bin:$PATH"
          curl -L "http://links.twibright.com/download/links-2.30.tar.bz2" -o links.tar.bz2
          tar -xjf links.tar.bz2
          cd links-2.30
          CC="aarch64-linux-musl-gcc -static" ./configure --host=aarch64-linux-musl --enable-graphics --with-fb --without-x --without-ssl --disable-utf8
          make -j$(nproc --all)
          aarch64-linux-musl-strip links
          mkdir -p $GITHUB_WORKSPACE/recovery/root/system/bin
          cp links $GITHUB_WORKSPACE/recovery/root/system/bin/links
          chmod 755 $GITHUB_WORKSPACE/recovery/root/system/bin/links

      - name: Build Red-Fox Recovery
        run: |
          mkdir -p ~/work/OrangeFox/device/realme/RMX3624
          cp -r $GITHUB_WORKSPACE/* ~/work/OrangeFox/device/realme/RMX3624/
          cd ~/work/OrangeFox
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE=RMX3624
          export LC_ALL="C"
          source build/envsetup.sh
          lunch twrp_RMX3624-eng
          mka recoveryimage -j$(nproc --all)

      - name: Upload Red-Fox Recovery Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RedFox-Recovery-RMX3624-v1.0
          path: ~/work/OrangeFox/out/target/product/RMX3624/*.img
